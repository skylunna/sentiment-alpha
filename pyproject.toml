[project]
name = "sentiment-alpha"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "pandas>=2.3.3",
    "plotly>=6.6.0",
    "requests>=2.33.0",
    "ruff>=0.15.8",
    "streamlit>=1.55.0",
    "torch>=2.11.0",
    "transformers>=5.3.0",
    "yfinance>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src", "."]  
testpaths = ["test", "tests"]  # 测试目录
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
]

# 注册自定义标记，消除警告
markers = [
    "integration: marks tests that require network access",
    "slow: marks tests that take longer than 5 seconds",
    "core: marks core functionality tests",
    "timezone: marks timezone handling tests"
]
